[editor]
; Hold the hold key in the vehicle editor: your Forward/Backward, Left/Right and Interact Left/Right
; binds (default W/S, A/D, Q/E) rotate the part. Rebinds apply instantly.
hold_rotate=1
; 1 = keys follow the camera as it is when you press the hold key: W/S roll the part away from / towards
; you like a wheel, A/D steer it left / right, Q/E lay it over onto its side / upside down.
; Q/E turn about the axis nearest your view, so looking down they spin the part flat. 0 = fixed vehicle X / Y / Z.
camera_relative=1
; game = use the game's own "Show Rotation UI" keybind (rebind it in Controls; it no longer toggles
; the old rotation UI). Or any key name the game uses, e.g. capslock, tab, lalt, lshift, f1, b
hold_key=game
; Rotation rings drawn around the held part while the hold key is down (red X, green Y, blue Z),
; each labelled with its keys. Replaces the game's own rotation hints.
rings=1
ring_radius_cm=45
orbit_deg_per_sec=30
; Swap the direction of a pair (1 = e.g. Forward and Backward swap)
invert_ws=0
invert_ad=0
invert_qe=0
